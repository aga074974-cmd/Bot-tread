<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ایزی‌تریدر (نمونه آزمایشی)</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 12px 12px 72px; }
  label { display: block; margin-top: 12px; font-size: 14px; color: #333; }
  input { display: block; width: 100%; box-sizing: border-box; padding: 10px; margin: 8px 0; font-size: 16px; }
  button { font: inherit; }
  #alert-item { background: #fdd; color: #900; border-radius: 6px; padding: 10px; margin: 10px 0; }
  #alert-item[hidden] { display: none; }
  .btn { display: inline-block; padding: 10px 18px; margin: 6px 0; background: #245; color: #fff; border-radius: 6px; cursor: pointer; }
  .result { padding: 12px; border-bottom: 1px solid #ddd; cursor: pointer; }
  .nav { position: fixed; inset-inline: 0; bottom: 0; display: flex; justify-content: space-around; background: #eee; padding: 10px 0; }
  .nav div { cursor: pointer; }
  .toast { background: #0a6; color: #fff; padding: 12px; border-radius: 6px; }
  #keypad:empty { display: none; }
  #keypad > div { position: fixed; inset-inline: 0; bottom: 0; background: #ddd; padding: 8px;
                  display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  #keypad button { padding: 14px; font-size: 18px; }
</style>
</head>
<body>
<!-- The real app renders inside <div id="root"> and adds keyboard-open to it
     while its numeric keypad is up. Both are reproduced here. -->
<div id="root">
  <div id="screen"></div>
  <div id="keypad"></div>
</div>
<script>
// A stand-in for m.easytrader.ir's mobile UI: same Persian labels and the same
// screen order as the real app, so the connector can be driven end to end
// without touching a live brokerage account. Scenarios are selected with query
// params (see tests/conftest.py).
const params = new URLSearchParams(location.search);
const opt = (key, fallback) => params.get(key) ?? fallback;

// Everything the "site" saw the connector do. Tests read this back through
// page.evaluate() to assert on behaviour rather than on screenshots.
const rec = window.__record = {
  restoredSession: false,
  loginSubmittedWith: null,
  typedKeys: {username: 0, password: 0},
  searchedFor: null,
  symbolOpened: null,
  side: null,
  quantity: null,
  price: null,
  submitClicked: false,
  confirmClicked: false,
  keypadPresses: [],
  userAgent: navigator.userAgent,
  viewportWidth: window.innerWidth,
  hasTouch: 'ontouchstart' in window || navigator.maxTouchPoints > 0,
};

const root = document.getElementById('root');
const screen = document.getElementById('screen');
const show = html => { screen.innerHTML = html; closeKeypad(); };

// Both number boxes open pre-filled — the real ones come from the account's
// buying power and the last trade — and both display Persian digits, which is
// what the connector has to read back through.
const PREFILL = { quantity: '1234', price: '12500' };
const raw = { ...PREFILL };

// ---------------------------------------------------------------- login ----
// Mirrors the real login inputs, which are wired to an on-screen keyboard
// widget: `input` modes decide which kind of event the field will accept.
//   accept   - an ordinary field, takes anything
//   stubborn - only real keystrokes count; a programmatic value set is undone
//   nokeys   - the opposite: ignores typing, accepts a programmatic set
//   reject   - refuses both
function guard(el, mode, which) {
  let sawKeydown = false;
  el.addEventListener('keydown', () => { sawKeydown = true; rec.typedKeys[which]++; });
  el.addEventListener('input', () => {
    const typed = sawKeydown;
    sawKeydown = false;
    const refuse = mode === 'reject'
      || (mode === 'stubborn' && !typed)
      || (mode === 'nokeys' && typed);
    if (refuse) el.value = '';
  });
}

// Note what is NOT here: the inputs carry no placeholder attribute. On the
// real site those Persian strings are <label>s above the boxes, which is why
// the connector matches on #user-name / #password instead.
function renderLogin() {
  // 'none' keeps the word ورود on screen but not as a submit button, so a
  // connector that went back to matching button text would still be caught.
  const submit = opt('button', 'submit') === 'none'
    ? '<div class="btn">ورود</div>'
    : '<button type="submit" class="btn">ورود</button>';

  show(`
    <h2>ورود به حساب کاربری</h2>
    <form id="login-form" onsubmit="event.preventDefault(); submitLogin();">
      <label for="user-name">کدملی/شماره‌همراه/شناسه‌ملی/نام‌کاربری</label>
      <input id="user-name" name="user-name" autocomplete="username">
      <label for="password">کلمه عبور</label>
      <input id="password" name="password" type="password" autocomplete="current-password">
      <div id="alert-item" hidden></div>
      ${submit}
    </form>
  `);

  const mode = opt('input', 'accept');
  guard(document.getElementById('user-name'), mode, 'username');
  guard(document.getElementById('password'), mode, 'password');
}

function submitLogin() {
  rec.loginSubmittedWith = [
    document.getElementById('user-name').value,
    document.getElementById('password').value,
  ];

  if (opt('badlogin')) {
    // alert=none  -> a further step that carries no message of its own
    // alert=empty -> the banner element is there but says nothing
    if (opt('alert') === 'none') {
      show('<h2>ورود به حساب کاربری</h2><p>رمز یکبار مصرف را وارد کنید</p><input id="otp">');
      return;
    }
    const banner = document.getElementById('alert-item');
    if (opt('alert') !== 'empty') {
      banner.textContent = opt('alert', 'نام کاربری یا کلمه عبور اشتباه است');
      banner.hidden = false;
    }
    return;
  }

  localStorage.setItem('session', 'ok');
  renderApp();
}

// ------------------------------------------------------------ app shell ----
// The connector treats any item of the app's own bottom bar as proof that it
// is inside the app. `markers` renders only one of them, so each can be
// tested on its own.
const marker = name => ['all', name].includes(opt('markers', 'all'));

function navHtml() {
  const tabs = [];
  if (marker('watch')) tabs.push('<a role="button" data-cy="main-navbar-market-watch">دیده‌بان</a>');
  if (marker('search')) tabs.push('<a role="button" data-cy="main-navbar-search" onclick="renderSearch()">جستجو</a>');
  if (marker('portfolio')) tabs.push('<a role="button" data-cy="main-navbar-portfolio">پرتفوی</a>');
  if (marker('order')) tabs.push('<a role="button" data-cy="main-navbar-order">سفارش‌ها</a>');
  return `<div class="nav">${tabs.join('')}</div>`;
}

function renderApp() {
  show(`<h2>خانه</h2><p>وضعیت بازار</p><span data-cy="account-balance-value">۱۲٬۵۰۰٬۰۰۰</span>${navHtml()}`);
}

function renderSearch() {
  show(`<input id="q" placeholder="جستجوی نماد"><div id="results"></div>${navHtml()}`);
  document.getElementById('q').addEventListener('input', event => {
    const term = event.target.value.trim();
    rec.searchedFor = term;
    document.getElementById('results').innerHTML = term
      ? `<div class="result" onclick="openSymbol('${term}')">${term}</div>`
      : '';
  });
}

function openSymbol(symbol) {
  rec.symbolOpened = symbol;
  show(`
    <h2>${symbol}</h2>
    <p>آخرین معامله: ${faDigits(PREFILL.price)}</p>
    <div class="btn" onclick="openTicket('buy')">خرید</div>
    <div class="btn" onclick="openTicket('sell')">فروش</div>
    ${navHtml()}`);
}

// --------------------------------------------------------- order ticket ----
// Both boxes are readonly with a uikeyboard attribute, exactly as captured
// from the real order form: nothing can be typed into them. Tapping one opens
// the app's keypad, which is announced by keyboard-open on #root.
//   keypad=text     - keys are plain buttons carrying an ASCII digit (default)
//   keypad=persian  - the same, labelled with Persian digits
//   keypad=cy       - keys carry data-cy hooks
//   keypad=alien    - a keypad whose markup matches nothing we know
//   keypad=none     - tapping the box opens nothing at all
//   qty=sticky      - backspace does not delete
//   qty=garbled     - every key enters a 9
//   buycy=none      - the buy button has no data-cy, only its Persian text
let keypadTarget = null;

function faDigits(value) {
  return value
    .replace(/\B(?=(\d{3})+(?!\d))/g, '٬')
    .replace(/[0-9]/g, d => '۰۱۲۳۴۵۶۷۸۹'[+d]);
}

function renderField(target) {
  const box = document.getElementById(target);
  if (box) box.value = faDigits(raw[target]);
}

function openTicket(side) {
  rec.side = side;
  raw.quantity = PREFILL.quantity;
  raw.price = PREFILL.price;

  const submitCy = side === 'buy' && opt('buycy') === 'none'
    ? ''
    : ` data-cy="oms-order-form-submit-button-${side}"`;

  show(`
    <h2>${side === 'buy' ? 'خرید' : 'فروش'} ${rec.symbolOpened}</h2>
    <span class="label-widget">تعداد</span>
    <input uikeyboard inputmode="decimal" id="quantity" readonly placeholder=""
           data-cy="order-form-input-quantity" onclick="openKeypad('quantity')">
    <span class="label-widget">قیمت</span>
    <input uikeyboard inputmode="decimal" id="price" readonly placeholder=""
           data-cy="order-form-input-price" onclick="openKeypad('price')">
    <button type="button"${submitCy} onclick="submitOrder()">
      <span class="button-text">${side === 'buy' ? 'ارسال خرید' : 'ارسال فروش'}</span>
    </button>
    ${navHtml()}`);

  renderField('quantity');
  renderField('price');
}

// ---------------------------------------------------------------- keypad ----
function closeKeypad() {
  keypadTarget = null;
  root.classList.remove('keyboard-open');
  document.getElementById('keypad').innerHTML = '';
}

function openKeypad(target) {
  if (opt('keypad') === 'none') return;
  keypadTarget = target;
  root.classList.add('keyboard-open');

  const mode = opt('keypad', 'text');
  const label = d => (mode === 'persian' ? '۰۱۲۳۴۵۶۷۸۹'[d] : String(d));
  const hook = (name) => (mode === 'cy' ? ` data-cy="keyboard-${name}"` : '');

  const keys = [...Array(10).keys()]
    .map(d => `<button${hook('key-' + d)} onclick="pressKey('${d}')">${label(d)}</button>`)
    .join('');
  const backspace = mode === 'cy'
    ? '<button data-cy="keyboard-backspace" onclick="pressBackspace()">⌫</button>'
    : '<button class="backspace" onclick="pressBackspace()">⌫</button>';

  // 'alien' keeps the same keys but wraps them in markup nothing recognises.
  const cls = mode === 'alien' ? 'zz-panel' : 'numeric-keyboard';
  document.getElementById('keypad').innerHTML = `<div class="${cls}">${keys}${backspace}</div>`;
}

function pressKey(digit) {
  rec.keypadPresses.push(digit);
  raw[keypadTarget] += (opt('qty') === 'garbled' ? '9' : digit);
  renderField(keypadTarget);
}

function pressBackspace() {
  rec.keypadPresses.push('back');
  if (opt('qty') !== 'sticky') raw[keypadTarget] = raw[keypadTarget].slice(0, -1);
  renderField(keypadTarget);
}

// Sending is final here — the real broker has no confirmation step. With
// `confirm_trap` a تایید button is put on screen anyway: nothing should ever
// click it, and the record shows if something did.
const trapHtml = () => opt('confirm_trap')
  ? '<div class="btn" onclick="window.__record.confirmClicked = true">تایید</div>'
  : '';

function submitOrder() {
  rec.submitClicked = true;
  rec.quantity = raw.quantity;
  rec.price = raw.price;
  // The reply is not instant on the real site; `reply` reproduces that lag,
  // which is the whole reason for the second screenshot.
  show(`<p>در حال ارسال…</p>${trapHtml()}${navHtml()}`);
  setTimeout(finish, Number(opt('reply', 0)));
}

function finish() {
  if (opt('outcome') === 'nosuccess') {
    show(`<p>در حال پردازش…</p>${navHtml()}`);
    return;
  }
  show(`<div class="toast">سفارش شما با موفقیت ثبت شد</div>${trapHtml()}${navHtml()}`);
}

// ------------------------------------------------------------------ boot ----
function boot() {
  if (opt('stuck')) {
    show('<p>در حال بارگذاری…</p>');
    return;
  }
  if (localStorage.getItem('session') === 'ok') {
    rec.restoredSession = true;
    renderApp();
    return;
  }
  renderLogin();
}

// The real site is an Angular SPA behind an OAuth redirect: the page is blank
// for a moment after load. `boot` delays the first paint to reproduce that.
setTimeout(boot, Number(opt('boot', 0)));
</script>
</body>
</html>

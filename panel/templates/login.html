<!doctype html>
<html dir="rtl" lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ورود - پنل سفارش‌ها</title>
{% include "_style.html" %}
<style>
  /* The shared sheet lays out a scrolling page of cards; this one page is a
     single box in the middle of the screen, so only the framing differs. */
  body { display: flex; align-items: center; justify-content: center;
         min-height: 100svh; max-width: none; }
  form.login { background: var(--surface); border: 1px solid var(--line-soft);
               border-radius: var(--radius); box-shadow: var(--shadow);
               padding: 1.6rem 1.4rem; width: 100%; max-width: 340px; }
  form.login h1 { font-size: 1.05rem; margin-bottom: 1.1rem; }
  form.login .lock { display: block; font-size: 1.6rem; margin-bottom: 0.4rem; }
</style>
</head>
<body>
<form class="login" method="post" action="/login">
  <span class="lock" aria-hidden="true">🔒</span>
  <h1>ورود به پنل ربات سفارش</h1>
  {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
  <input type="password" name="password" placeholder="رمز عبور پنل" autofocus required>
  <button class="submit" type="submit">ورود</button>
</form>
</body>
</html>

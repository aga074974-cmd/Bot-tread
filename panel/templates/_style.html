{# Shared look for the dashboard, the history page and the live-login page. #}
<style>
  /* One palette, named once. Everything below is written in these, so the
     whole panel can be re-toned from here without hunting for hex codes. */
  :root {
    --bg: #0b1120;
    --bg-glow-1: rgba(34, 197, 94, 0.10);
    --bg-glow-2: rgba(56, 189, 248, 0.08);
    --surface: #131c2e;
    --surface-2: #1a2437;
    --sunken: #0d1524;
    --line: #23304a;
    --line-soft: #1b2438;
    --text: #e8eef7;
    --muted: #93a3bb;
    --faint: #64748b;
    --accent: #22c55e;
    --accent-dim: #16a34a;
    --accent-ink: #052e16;
    --info: #38bdf8;
    --radius: 16px;
    --radius-sm: 11px;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px -12px rgba(0, 0, 0, 0.6);
    --tap: 44px;  /* nothing you have to hit with a thumb is smaller than this */
  }

  * { box-sizing: border-box; }

  /* Persian first, and only fonts a phone already has — a webfont would be one
     more thing to fetch on a connection that is already the slow part. */
  body {
    font-family: Vazirmatn, "IRANSans", "IRANYekan", -apple-system, "Segoe UI",
                 Roboto, Tahoma, sans-serif;
    background: var(--bg);
    /* Two soft washes of colour so the page has some depth behind the cards
       instead of being one flat sheet. Fixed, so scrolling does not drag them. */
    background-image:
      radial-gradient(60rem 30rem at 85% -10%, var(--bg-glow-1), transparent 60%),
      radial-gradient(50rem 28rem at 5% 8%, var(--bg-glow-2), transparent 55%);
    background-attachment: fixed;
    color: var(--text);
    margin: 0 auto;
    max-width: 620px;
    padding: 1rem;
    padding-bottom: calc(1rem + env(safe-area-inset-bottom));
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }

  h1 { font-size: 1.15rem; margin: 0; line-height: 1.45; letter-spacing: -0.01em; }
  h1 .brand { display: block; color: #facc15; font-size: 0.7rem; font-weight: normal;
              letter-spacing: 0; }

  /* Three columns rather than a flex row, because the session light has to
     sit in the true middle of the header: the two 1fr columns are equal by
     definition, so the middle one is centred no matter how much wider the
     robot is than the title. A header with only two children (every page but
     the dashboard) pins its last child to the third column, so those keep
     the far-apart look they had. On a screen too narrow for the robot to fit
     in a third of the width, the columns simply give way — the light drifts
     off centre instead of anything overlapping or the page scrolling. */
  .top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
         gap: 0.6rem; margin-bottom: 1.1rem; }
  .top > :first-child { justify-self: start; }
  .top > :last-child { grid-column: 3; justify-self: end; }
  .top a { color: var(--muted); font-size: 0.85rem; text-decoration: none;
           white-space: nowrap; border: 1px solid var(--line); border-radius: 999px;
           padding: 0.35rem 0.75rem; }
  .top a:active { background: var(--surface-2); color: var(--text); }

  /* The login-session status light: a plain dot, not a badge. The ring is
     drawn with a shadow rather than a border so it stays perfectly round, and
     a second, wider halo in its own colour makes it read as lit. */
  .session-group { justify-self: center; position: relative; display: flex; align-items: center; }
  .session-light { width: 26px; height: 26px; border-radius: 50%; border: none; padding: 0;
                   cursor: pointer; justify-self: center; position: relative; }
  /* The dot is a button you tap to re-check the session, and a 26px target is
     a thin one for a finger. This pad widens what counts as a tap to 44px
     without drawing anything, so the dot stays the size it looks. */
  .session-light::after { content: ''; position: absolute; inset: -9px; border-radius: 50%; }
  .session-light-valid { background: var(--accent);
                         box-shadow: 0 0 0 3px var(--bg), 0 0 0 7px rgba(34, 197, 94, 0.18); }
  .session-light-invalid { background: #ef4444;
                           box-shadow: 0 0 0 3px var(--bg), 0 0 0 7px rgba(239, 68, 68, 0.18); }
  .session-light-checking { background: #eab308;
                            box-shadow: 0 0 0 3px var(--bg), 0 0 0 7px rgba(234, 179, 8, 0.18);
                            animation: session-blink 0.8s ease-in-out infinite; }
  @keyframes session-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  /* The manual-login chip, centred under the light. Taken out of flow so its
     width cannot widen the middle column and shove the light off centre. */
  .top a.manual-login-link {
    position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
    margin-top: 0.4rem; display: inline-flex; align-items: center; gap: 0.3rem;
    white-space: nowrap; text-decoration: none; padding: 0.22rem 0.6rem;
    font-size: 0.72rem; font-weight: bold; color: #7dd3fc;
    background: rgba(56, 189, 248, 0.12);
    border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 999px;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  /* Only the fill moves on a press — the transform is what centres this on
     the light, so touching it here would shift the chip sideways. */
  .top a.manual-login-link:active { background: rgba(56, 189, 248, 0.28);
                                    border-color: rgba(56, 189, 248, 0.6); }
  .manual-login-link svg { width: 11px; height: 11px; display: block; flex-shrink: 0; }

  @media (prefers-reduced-motion: reduce) {
    .session-light-checking { animation: none; opacity: 0.7; }
    .top a.manual-login-link { transition: none; }
  }

  /* ---- surfaces ---------------------------------------------------- */

  .card { background: var(--surface); border: 1px solid var(--line-soft);
          border-radius: var(--radius); padding: 1.15rem; margin-bottom: 1rem;
          box-shadow: var(--shadow); }
  /* A card's title, marked by a short accent rule rather than a heavier font:
     it separates the sections at a glance without shouting. */
  .card h2 { font-size: 0.95rem; margin: 0 0 0.9rem; display: flex; align-items: center;
             gap: 0.5rem; letter-spacing: -0.01em; }
  .card h2::before { content: ''; width: 3px; height: 1em; border-radius: 2px;
                     background: var(--accent); flex-shrink: 0; }

  /* ---- form -------------------------------------------------------- */

  label { display: block; font-size: 0.78rem; color: var(--muted); margin-top: 0.9rem;
          margin-bottom: 0.35rem; }
  input, select {
    width: 100%; min-height: var(--tap); padding: 0.6rem 0.75rem;
    border-radius: var(--radius-sm); border: 1px solid var(--line);
    background: var(--sunken); color: var(--text);
    font-family: inherit; font-size: 1rem;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input::placeholder { color: var(--faint); }
  /* A visible focus ring matters more on a phone than anywhere else: it is
     the only sign of which box the keyboard is about to type into. */
  input:focus, select:focus, button:focus-visible, a:focus-visible {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.18);
  }
  /* The box the complaint is about. Not :invalid — an empty required field is
     invalid from the moment the page loads, and outlining it in red before
     anyone has touched it would be nagging, not helping. This is put on only
     once the form has actually been sent. Its focus ring turns too, or the
     panel's green one would be telling them it is fine. */
  input.needs-attention { border-color: rgba(239, 68, 68, 0.55); }
  input.needs-attention:focus { border-color: #f87171;
                                box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.18); }

  /* A label that carries its field's complaint beside it. */
  .label-row { display: flex; align-items: center; gap: 0.4rem; }
  .field-warning { display: inline-flex; align-items: center; gap: 0.3rem;
                   color: #fca5a5; font-size: 0.75rem; }
  .field-warning[hidden] { display: none; }
  .field-warning .mark { width: 16px; height: 16px; border-radius: 50%;
                         border: 1px solid #fca5a5; flex-shrink: 0;
                         display: inline-flex; align-items: center; justify-content: center;
                         font-size: 0.72rem; font-weight: bold; line-height: 1; }

  .row { display: flex; gap: 0.55rem; }
  .row > div { flex: 1; min-width: 0; }
  .checkbox-row { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem;
                  color: #cbd5e1; margin-top: 0.9rem; cursor: pointer; }
  .checkbox-row input { width: auto; min-height: 0; margin: 0; accent-color: var(--accent); }

  button.submit {
    width: 100%; min-height: var(--tap); padding: 0.8rem; border: none;
    border-radius: var(--radius-sm);
    background: linear-gradient(180deg, var(--accent), var(--accent-dim));
    color: var(--accent-ink); font-family: inherit; font-weight: bold; font-size: 1rem;
    margin-top: 1.3rem; cursor: pointer;
    box-shadow: 0 5px 14px -9px rgba(34, 197, 94, 0.65);
  }
  button.submit:active { background: var(--accent-dim); box-shadow: none; }

  /* ---- orders --------------------------------------------------- */

  /* One order per row, two lines: what was ordered above when it is due, with
     its status and its actions on the other side. It used to be a table, and
     a table of six columns does not fit a phone — it scrolled sideways, and
     the cancel button sat off the edge of the screen, unreachable without
     realising the table could be dragged. Nothing here scrolls. */
  .orders { list-style: none; margin: 0; padding: 0; }
  .order { display: flex; align-items: center; gap: 0.6rem;
           padding: 0.7rem 0.1rem; border-top: 1px solid var(--line-soft); }
  .order:first-child { border-top: none; padding-top: 0.2rem; }
  .order-main { flex: 1; min-width: 0; }
  .order-title { display: flex; align-items: baseline; gap: 0.4rem; flex-wrap: wrap; }
  .order-title .sym { font-weight: bold; font-size: 0.95rem; }
  /* Buy and sell in the colours the broker's own app uses for them. */
  .order-title .side { font-size: 0.75rem; padding: 0.05rem 0.45rem; border-radius: 999px; }
  .order-title .side.buy { background: rgba(34, 197, 94, 0.14); color: #86efac; }
  .order-title .side.sell { background: rgba(239, 68, 68, 0.14); color: #fca5a5; }
  .order-title .qty { font-size: 0.85rem; color: var(--muted);
                      font-variant-numeric: tabular-nums; }
  .order-when { font-size: 0.78rem; color: var(--faint); margin-top: 0.15rem;
                font-variant-numeric: tabular-nums; }
  .order-when .time { color: var(--muted); }
  .order-actions { display: flex; align-items: center; gap: 0.35rem; flex-shrink: 0; }

  .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 999px;
           font-size: 0.74rem; font-family: inherit; border: 1px solid transparent;
           white-space: nowrap; }
  /* A status you can tap for the reason says so with a dotted underline —
     dimmed against the badge's own colour, or at this size it reads as a
     scribble under the word rather than a hint. */
  button.badge { cursor: pointer; text-decoration: underline dotted;
                 text-decoration-color: color-mix(in srgb, currentColor 45%, transparent);
                 text-underline-offset: 3px; }
  .pending { background: rgba(148, 163, 184, 0.12); color: #cbd5e1;
             border-color: rgba(148, 163, 184, 0.3); }
  .sent { background: rgba(34, 197, 94, 0.13); color: #86efac;
          border-color: rgba(34, 197, 94, 0.35); }
  .failed { background: rgba(239, 68, 68, 0.13); color: #fca5a5;
            border-color: rgba(239, 68, 68, 0.35); }
  .skipped { background: rgba(249, 115, 22, 0.13); color: #fdba74;
             border-color: rgba(249, 115, 22, 0.35); }

  form.inline { display: inline; }
  .cancel-btn { background: none; border: 1px solid var(--line); color: var(--muted);
                border-radius: 8px; padding: 0.3rem 0.6rem; font-size: 0.75rem;
                font-family: inherit; cursor: pointer; }
  .cancel-btn:active { background: rgba(239, 68, 68, 0.15); color: #fca5a5;
                       border-color: rgba(239, 68, 68, 0.4); }

  .empty { color: var(--faint); font-size: 0.85rem; }
  .empty a { color: var(--info); text-decoration: none; }
  .more { display: inline-block; margin-top: 0.9rem; color: var(--info);
          font-size: 0.85rem; text-decoration: none; }

  .flash { background: rgba(34, 197, 94, 0.12); color: #86efac;
           border: 1px solid rgba(34, 197, 94, 0.35); padding: 0.7rem 1rem;
           border-radius: var(--radius-sm); margin-bottom: 1rem; font-size: 0.9rem; }
  .flash.error { background: rgba(239, 68, 68, 0.12); color: #fca5a5;
                 border-color: rgba(239, 68, 68, 0.35); }

  /* ---- toasts ------------------------------------------------------ */

  /* Two of them, on purpose. The orders table's #toast does not exist in the
     DOM at all on a fresh panel with no orders yet, and the session light has
     to work whether or not any order has ever run. */
  #toast, #session-toast {
    position: fixed; inset-inline: 1rem; bottom: calc(1rem + env(safe-area-inset-bottom));
    max-width: 588px; margin: 0 auto; border-radius: var(--radius-sm);
    padding: 0.85rem 1rem; font-size: 0.85rem; line-height: 1.7; z-index: 10;
    box-shadow: var(--shadow); backdrop-filter: blur(6px);
  }
  #session-toast { background: rgba(20, 83, 45, 0.92); color: #86efac;
                   border: 1px solid #166534; }
  #session-toast.error, #toast { background: rgba(69, 10, 10, 0.92); color: #fecaca;
                                 border: 1px solid #7f1d1d; }
  #toast[hidden], #session-toast[hidden] { display: none; }
  #session-toast a { color: inherit; text-decoration: underline; font-weight: bold; }

  /* ---- the per-order screenshot gallery ---------------------------- */

  .gallery-btn { background: none; border: none; color: var(--info); font-size: 0.75rem;
                 cursor: pointer; padding: 0 0.35rem; font-family: inherit;
                 vertical-align: middle; }
  #gallery-modal { position: fixed; inset: 0; background: rgba(2, 6, 23, 0.97); z-index: 20;
                   display: flex; flex-direction: column; }
  #gallery-modal[hidden] { display: none; }
  .gallery-bar { display: flex; align-items: center; gap: 0.6rem; padding: 0.85rem 1rem;
                 padding-top: calc(0.85rem + env(safe-area-inset-top));
                 border-bottom: 1px solid var(--line); flex-shrink: 0; }
  .gallery-bar .title { flex: 1; font-size: 0.8rem; color: var(--muted); overflow: hidden;
                        text-overflow: ellipsis; white-space: nowrap; }
  .gallery-bar button { background: none; border: none; color: var(--text); font-size: 1rem;
                        cursor: pointer; padding: 0.2rem 0.4rem; font-family: inherit; }
  .gallery-bar a.bar-dl { color: var(--text); font-size: 1.1rem; text-decoration: none;
                          padding: 0.2rem 0.5rem; }
  .gallery-bar a.bar-dl[hidden] { display: none; }
  .gallery-grid { flex: 1; overflow-y: auto; display: grid;
                  grid-template-columns: repeat(3, 1fr); gap: 0.55rem; padding: 1rem;
                  align-content: start; }
  .gallery-grid img { width: 100%; aspect-ratio: 1; object-fit: cover;
                      border-radius: var(--radius-sm); border: 1px solid var(--line);
                      cursor: pointer; display: block; }
  /* Each tile carries its own download corner, so saving a shot is one tap
     from the grid rather than a trip through the fullscreen view. Sized for a
     fingertip, and dark enough to stay legible over a pale screenshot. */
  .gallery-item { position: relative; }
  .dl-badge { position: absolute; inset-block-end: 5px; inset-inline-end: 5px;
              width: 32px; height: 32px; border-radius: 9px; text-decoration: none;
              background: rgba(2, 6, 23, 0.82); border: 1px solid #475569;
              color: var(--text); font-size: 0.95rem;
              display: flex; align-items: center; justify-content: center; }
  .dl-badge:active { background: var(--bg); border-color: var(--muted); }
  .gallery-grid a.html-item { aspect-ratio: 1; display: flex; align-items: center;
                              justify-content: center; background: var(--surface-2);
                              border: 1px solid var(--line); border-radius: var(--radius-sm);
                              color: var(--muted); font-size: 1.6rem; text-decoration: none; }
  .gallery-full { flex: 1; display: flex; align-items: center; justify-content: center;
                  overflow: hidden; }
  .gallery-full img { max-width: 100%; max-height: 100%; object-fit: contain; }
  /* Both panels set their own display (grid/flex), which otherwise outranks
     the browser's default [hidden]{display:none} at equal specificity — so
     toggling the hidden attribute alone would not actually hide either one. */
  .gallery-grid[hidden], .gallery-full[hidden] { display: none; }

  /* ---- the header's robot ------------------------------------------ */

  /* A small decorative badge next to the header title: a robot waving hello,
     then dropping through a trapdoor. Pure inline SVG/CSS (plus a couple of
     SMIL animateTransform elements for the arms) — no image file and no
     script, so there is nothing here to load or fail. The svg's own 680x430
     viewBox is scaled down to fit the container; the container's aspect
     ratio matches it so nothing is stretched or letterboxed. Left unclipped
     (overflow: visible) so nothing outside that viewBox gets cut off — the
     svg's own internal clipPath still hides the robot below the trapdoor,
     which is the point of it. It takes no taps: it is decoration, and its box
     reaches further than its drawing does. */
  .robot-badge { flex-shrink: 0; width: 140px; height: 88px; overflow: visible;
                 pointer-events: none; }
  .robot-badge svg { width: 100%; height: 100%; overflow: visible; display: block; }
  @media (prefers-reduced-motion: reduce) {
    .robot-badge .rf-fall, .robot-badge .rf-bob, .robot-badge .rf-eyes,
    .robot-badge .rf-lookdown, .robot-badge .rf-arc, .robot-badge .rf-bubble,
    .robot-badge .rf-doorL, .robot-badge .rf-doorR, .robot-badge .rf-hole { animation: none; }
  }
</style>

{# Shared look for the dashboard and the history page. #}
<style>
  * { box-sizing: border-box; }
  body { font-family: Tahoma, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 1rem; }
  h1 { font-size: 1.2rem; margin: 0; line-height: 1.5; }
  h1 .brand { display: block; color: #facc15; font-size: 0.7rem; font-weight: normal; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 0.6rem; margin-bottom: 1rem; }
  .top a { color: #94a3b8; font-size: 0.85rem; text-decoration: none; white-space: nowrap; }
  .title-row { display: flex; align-items: center; gap: 0.5rem; }
  /* The login-session status light: a plain dot, not a badge, so it reads at
     a glance next to the title. Its ring is the page's own background color
     rather than a border, so the dot still looks round against the dark
     page instead of squared off by a box model edge. */
  .session-light { width: 12px; height: 12px; border-radius: 50%; border: none; padding: 0;
                    cursor: pointer; flex-shrink: 0; box-shadow: 0 0 0 2px #0f172a; }
  .session-light-valid { background: #22c55e; }
  .session-light-invalid { background: #ef4444; }
  .session-light-checking { background: #eab308; animation: session-blink 0.8s ease-in-out infinite; }
  @keyframes session-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) {
    .session-light-checking { animation: none; opacity: 0.7; }
  }
  /* A second, independent toast — the orders table's #toast (below) does not
     exist in the DOM at all on a fresh panel with zero orders yet, and the
     session light has to work regardless of whether any order has ever run. */
  #session-toast { position: fixed; inset-inline: 1rem; bottom: 1rem; background: #14532d; color: #86efac;
                    border: 1px solid #166534; border-radius: 10px; padding: 0.8rem 1rem; font-size: 0.85rem;
                    line-height: 1.7; z-index: 10; }
  #session-toast.error { background: #450a0a; color: #fca5a5; border-color: #7f1d1d; }
  #session-toast[hidden] { display: none; }
  .checkbox-row { display: flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; color: #cbd5e1;
                   margin-top: 0.8rem; cursor: pointer; }
  .checkbox-row input { width: auto; margin: 0; }
  .card { background: #1e293b; border-radius: 12px; padding: 1.2rem; margin-bottom: 1.2rem; }
  .card h2 { font-size: 1rem; margin-top: 0; }
  label { display: block; font-size: 0.85rem; color: #94a3b8; margin-top: 0.8rem; }
  input, select { width: 100%; box-sizing: border-box; padding: 0.6rem; margin-top: 0.3rem; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 1rem; }
  .row { display: flex; gap: 0.6rem; }
  .row > div { flex: 1; }
  button.submit { width: 100%; padding: 0.8rem; border: none; border-radius: 8px; background: #22c55e; color: #06210f; font-weight: bold; font-size: 1rem; margin-top: 1.2rem; }
  /* A phone is narrower than this table wants to be; let it scroll on its own
     instead of stretching the page sideways. */
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { padding: 0.5rem 0.4rem; text-align: right; border-bottom: 1px solid #334155; white-space: nowrap; }
  .when div { line-height: 1.5; }
  .when .time { color: #94a3b8; font-size: 0.8rem; }
  .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.75rem; font-family: inherit; border: none; }
  button.badge { cursor: pointer; text-decoration: underline dotted; }
  .pending { background: #334155; color: #cbd5e1; }
  .sent { background: #14532d; color: #86efac; }
  .failed { background: #450a0a; color: #fca5a5; }
  .skipped { background: #422006; color: #fdba74; }
  form.inline { display: inline; }
  .cancel-btn { background: none; border: 1px solid #475569; color: #94a3b8; border-radius: 6px; padding: 0.2rem 0.5rem; font-size: 0.75rem; font-family: inherit; }
  .empty { color: #64748b; font-size: 0.85rem; }
  .more { display: block; margin-top: 0.9rem; color: #38bdf8; font-size: 0.85rem; text-decoration: none; }
  .flash { background: #14532d; color: #86efac; padding: 0.6rem 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem; }
  .flash.error { background: #450a0a; color: #fca5a5; }
  /* The error toast: tapping a status that carries one brings it up here,
     over the page, for a few seconds. */
  #toast { position: fixed; inset-inline: 1rem; bottom: 1rem; background: #450a0a; color: #fecaca;
           border: 1px solid #7f1d1d; border-radius: 10px; padding: 0.8rem 1rem; font-size: 0.85rem;
           line-height: 1.7; z-index: 10; }
  #toast[hidden] { display: none; }
  /* The ▶ gallery trigger, next to a row's status badge, and the modal it
     opens: a thumbnail grid first, one image (or an html file's own tab)
     after that. */
  .gallery-btn { background: none; border: none; color: #38bdf8; font-size: 0.75rem;
                 cursor: pointer; padding: 0 0.3rem; font-family: inherit; vertical-align: middle; }
  #gallery-modal { position: fixed; inset: 0; background: rgba(2, 6, 23, 0.96); z-index: 20;
                   display: flex; flex-direction: column; }
  #gallery-modal[hidden] { display: none; }
  .gallery-bar { display: flex; align-items: center; gap: 0.6rem; padding: 0.8rem 1rem;
                 border-bottom: 1px solid #334155; flex-shrink: 0; }
  .gallery-bar .title { flex: 1; font-size: 0.8rem; color: #94a3b8; overflow: hidden;
                         text-overflow: ellipsis; white-space: nowrap; }
  .gallery-bar button { background: none; border: none; color: #e2e8f0; font-size: 1rem;
                         cursor: pointer; padding: 0.2rem 0.4rem; font-family: inherit; }
  .gallery-grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(3, 1fr);
                  gap: 0.5rem; padding: 1rem; align-content: start; }
  .gallery-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px;
                       border: 1px solid #334155; cursor: pointer; display: block; }
  .gallery-grid a.html-item { aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
                               background: #1e293b; border: 1px solid #334155; border-radius: 8px;
                               color: #94a3b8; font-size: 1.6rem; text-decoration: none; }
  .gallery-full { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .gallery-full img { max-width: 100%; max-height: 100%; object-fit: contain; }
  /* Both panels set their own display (grid/flex), which otherwise outranks
     the browser's default [hidden]{display:none} at equal specificity — so
     toggling the hidden attribute alone would not actually hide either one. */
  .gallery-grid[hidden], .gallery-full[hidden] { display: none; }
  /* A small decorative badge next to the header title: a robot counting a
     stack of banknotes. Pure inline SVG/CSS — no image file and no script,
     so there is nothing here to load or fail. Sized generously and left
     unclipped (overflow: visible throughout) so nothing gets cut off. */
  .robot-badge { flex-shrink: 0; width: 96px; height: 68px; overflow: visible; }
  .robot-badge svg { width: 100%; height: 100%; overflow: visible; display: block; }
  .robot-badge .bot-group { animation: bot-bob 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  .robot-badge .eye { transform-box: fill-box; transform-origin: 50% 50%; animation: eye-blink 4s ease-in-out infinite; }
  .robot-badge .antenna-tip { transform-box: fill-box; transform-origin: 50% 50%; animation: tip-pulse 1.8s ease-in-out infinite; }
  .robot-badge .bill-flip { transform-box: fill-box; transform-origin: 100% 50%; animation: bill-flip 1s ease-in-out infinite; }
  .robot-badge .thumb { transform-box: fill-box; transform-origin: 50% 100%; animation: thumb-riffle 1s ease-in-out infinite; }
  @keyframes bot-bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-1.5px); }
  }
  @keyframes eye-blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(0.15); }
  }
  @keyframes tip-pulse {
    0%, 100% { opacity: 0.7; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.25); }
  }
  @keyframes bill-flip {
    0%, 40% { transform: scaleX(1); }
    55% { transform: scaleX(0.1); }
    70%, 100% { transform: scaleX(1); }
  }
  @keyframes thumb-riffle {
    0%, 40% { transform: translateY(0) rotate(0deg); }
    55% { transform: translateY(-4px) rotate(-12deg); }
    70%, 100% { transform: translateY(0) rotate(0deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .robot-badge .bot-group, .robot-badge .eye, .robot-badge .antenna-tip,
    .robot-badge .bill-flip, .robot-badge .thumb { animation: none; }
  }
</style>
